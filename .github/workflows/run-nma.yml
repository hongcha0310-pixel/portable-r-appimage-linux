name: Run haemophilia NMA in R

on:
  push:
    branches: [main]
    paths:
      - 'run_nma.R'
      - '.github/workflows/run-nma.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nma:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::meta
            any::netmeta
          needs: |
            website

      - name: Run network meta-analysis
        run: Rscript run_nma.R

      - name: Upload R NMA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haemophilia-r-netmeta-results
          path: analysis/results
          retention-days: 30
          if-no-files-found: error
